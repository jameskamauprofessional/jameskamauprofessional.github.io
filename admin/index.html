<body>

<script>
const $=id=>document.getElementById(id);
let DATA=null;
let TOKEN='';try{TOKEN=sessionStorage.getItem('jk_profile_admin_token')||''}catch(e){}
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbx6n0gTTF_l8d4c_RGo3XjHYkGLZOGeGSEvJnqNxR6BnxtirWEZUbAiUWxavqiZLrED/exec';
const API_MESSAGE='JK_ADMIN_API';
const pendingRequests=new Map();
function apiCall(action,args){
  return new Promise((resolve,reject)=>{
    const requestId='jk_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const iframe=document.createElement('iframe'); iframe.name=requestId; iframe.style.display='none'; document.body.appendChild(iframe);
    const form=document.createElement('form'); form.method='POST'; form.action=APPS_SCRIPT_URL; form.target=requestId; form.style.display='none';
    const add=(name,value)=>{const i=document.createElement('input');i.type='hidden';i.name=name;i.value=value??'';form.appendChild(i)};
    add('action',action); add('token',TOKEN||''); add('payload',JSON.stringify(args===undefined?null:args)); add('requestId',requestId);
    pendingRequests.set(requestId,{resolve,reject,iframe,form}); document.body.appendChild(form);
    try{form.submit()}catch(e){pendingRequests.delete(requestId);iframe.remove();form.remove();reject(e)}
  });
}
window.addEventListener('message',function(event){
  const m=event.data||{}; if(m.type!==API_MESSAGE||!m.requestId)return;
  const p=pendingRequests.get(m.requestId); if(!p)return; pendingRequests.delete(m.requestId);
  try{p.iframe.remove();p.form.remove()}catch(e){}
  if(m.ok)p.resolve(m.data);else p.reject(new Error(m.message||'Server request failed.'));
});
const server={
  adminLogin:(email,pin)=>apiCall('adminLogin',{email,pin}),
  adminLogout:token=>apiCall('adminLogout',null),
  adminGetData:token=>apiCall('adminGetData',null),
  adminSaveProfile:(token,data)=>apiCall('adminSaveProfile',data),
  adminSaveExperience:(token,data)=>apiCall('adminSaveExperience',data),
  adminDeleteExperience:(token,id)=>apiCall('adminDeleteExperience',id),
  adminSaveEducation:(token,data)=>apiCall('adminSaveEducation',data),
  adminDeleteEducation:(token,id)=>apiCall('adminDeleteEducation',id),
  adminSaveSkill:(token,data)=>apiCall('adminSaveSkill',data),
  adminDeleteSkill:(token,id)=>apiCall('adminDeleteSkill',id),
  adminSaveProject:(token,data)=>apiCall('adminSaveProject',data),
  adminDeleteProject:(token,id)=>apiCall('adminDeleteProject',id),
  adminSaveContact:(token,items)=>apiCall('adminSaveContact',items),
  adminUploadGalleryImage:(token,payload)=>apiCall('adminUploadGalleryImage',payload),
  adminUpdateGallery:(token,data)=>apiCall('adminUpdateGallery',data),
  adminDeleteGalleryImage:(token,id)=>apiCall('adminDeleteGalleryImage',id),
  adminUploadProfilePhoto:(token,payload)=>apiCall('adminUploadProfilePhoto',payload),
  adminUploadResume:(token,payload)=>apiCall('adminUploadResume',payload),
  adminSaveContent:(token,data)=>apiCall('adminSaveContent',data),
  adminSaveSettings:(token,data)=>apiCall('adminSaveSettings',data)
};
function bridgeReady(){return true}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showStatus(msg){const e=$('status');e.textContent=msg;e.style.display='block';clearTimeout(window.__statusTimer);window.__statusTimer=setTimeout(()=>e.style.display='none',4500)}
function render(data){DATA=data||DATA}
async function login(){
  $('loginError').textContent='';if(!bridgeReady()){$('loginError').textContent='Please open the deployed /exec web app.';return}
  try{const r=await server.adminLogin($('loginEmail').value,$('loginPin').value);if(!r||!r.ok){$('loginError').textContent=(r&&r.message)||'Invalid credentials.';return}
    TOKEN=r.token;try{sessionStorage.setItem('jk_profile_admin_token',TOKEN)}catch(e){}$('loginView').style.display='none';$('dashboardView').style.display='block';await refreshAdmin();showStatus('Administrator access granted.')
  }catch(e){$('loginError').textContent=e.message||'Login failed.'}
}
async function logout(){try{if(TOKEN)await server.adminLogout(TOKEN)}catch(e){}TOKEN='';try{sessionStorage.removeItem('jk_profile_admin_token')}catch(e){}$('dashboardView').style.display='none';$('loginView').style.display='block';showStatus('Logged out successfully.')}
async function refreshAdmin(){try{const d=await server.adminGetData(TOKEN);DATA=d;render(d);buildAdmin()}catch(e){TOKEN='';sessionStorage.removeItem('jk_profile_admin_token');$('dashboardView').style.display='none';$('loginView').style.display='block';showStatus(e.message||'Admin session expired.')}}
function tab(name,btn){
  const panel=$('panel-'+name);
  if(!panel){showStatus('Admin section is unavailable: '+name);return false}
  document.querySelectorAll('.admin-panel').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  panel.classList.add('active');
  if(btn)btn.classList.add('active');
  panel.scrollIntoView({behavior:'smooth',block:'start'});
  return false;
}
function val(id){return $(id)?$(id).value:''}function setv(id,v){if($(id))$(id).value=v??''}
function buildAdmin(){buildProfile();buildContent();buildExperience();buildEducation();buildSkills();buildProjects();buildGalleryAdmin();buildContactAdmin();buildSettings()}

function buildProfile(){const p=DATA.profile||{};$('panel-profile').innerHTML=`<h3>Profile Information</h3><div class="form-grid"><div class="field"><label>Name</label><input id="p_name"></div><div class="field"><label>Headline</label><input id="p_headline"></div><div class="field"><label>Location</label><input id="p_location"></div><div class="field"><label>Phone</label><input id="p_phone"></div><div class="field full"><label>Professional Summary</label><textarea id="p_summary"></textarea></div><div class="field full"><label>Availability</label><textarea id="p_availability"></textarea></div></div><div class="admin-actions"><button class="action save" onclick="saveProfile()">Save Profile</button><label class="action secondary" style="display:inline-flex;align-items:center;gap:8px">Change Profile Photo<input id="profile_photo_file" type="file" accept="image/*" style="display:none" onchange="uploadProfilePhotoFromProfile()"></label></div>`;setv('p_name',p.name);setv('p_headline',p.headline);setv('p_location',p.location);setv('p_phone',p.phone);setv('p_summary',p.summary);setv('p_availability',p.availability)}
async function saveProfile(){try{DATA=await server.adminSaveProfile(TOKEN,{id:DATA.profile.id,name:val('p_name'),headline:val('p_headline'),location:val('p_location'),phone:val('p_phone'),summary:val('p_summary'),availability:val('p_availability')});render(DATA);buildAdmin();showStatus('Profile saved.')}catch(e){showStatus(e.message)}}

function buildContent(){const c=DATA.content||{expertise:[],tools:[]};const ex=c.expertise||[];const tools=c.tools||[];$('panel-content').innerHTML=`<h3>Website Content</h3><div class="notice">Edit the four expertise cards and the Tools & Technologies row shown on the public homepage. You can add, remove and reorder items.</div><h4>Expertise Cards</h4><div id="expertiseAdminList" class="list"></div><div class="admin-actions"><button class="action new" onclick="addExpertise()">+ Add Expertise</button></div><h4>Tools & Technologies</h4><div id="toolsAdminList" class="list"></div><div class="admin-actions"><button class="action new" onclick="addTool()">+ Add Tool</button><button class="action save" onclick="saveContent()">Save Website Content</button></div>`;ex.forEach(x=>addExpertise(x));tools.forEach(x=>addTool(x))}
function addExpertise(x={icon:'★',title:'',description:''}){const w=document.createElement('div');w.className='list-item content-edit';w.innerHTML=`<div class="form-grid" style="flex:1"><div class="field"><label>Icon</label><input class="cx_icon"></div><div class="field"><label>Title</label><input class="cx_title"></div><div class="field full"><label>Description</label><textarea class="cx_desc"></textarea></div></div><button class="action danger" onclick="this.closest('.content-edit').remove()">Remove</button>`;w.querySelector('.cx_icon').value=x.icon||'';w.querySelector('.cx_title').value=x.title||'';w.querySelector('.cx_desc').value=x.description||'';$('expertiseAdminList').appendChild(w)}
function addTool(x=''){const w=document.createElement('div');w.className='list-item tool-edit';w.innerHTML=`<input class="tool_name" value=""><button class="action danger" onclick="this.closest('.tool-edit').remove()">Remove</button>`;w.querySelector('.tool_name').value=x;$('toolsAdminList').appendChild(w)}
async function saveContent(){const expertise=[...document.querySelectorAll('#expertiseAdminList .content-edit')].map(x=>({icon:x.querySelector('.cx_icon').value,title:x.querySelector('.cx_title').value,description:x.querySelector('.cx_desc').value})).filter(x=>x.title||x.description);const tools=[...document.querySelectorAll('#toolsAdminList .tool-edit')].map(x=>x.querySelector('.tool_name').value.trim()).filter(Boolean);try{DATA=await server.adminSaveContent(TOKEN,{expertise,tools});render(DATA);buildContent();showStatus('Website content saved.')}catch(e){showStatus(e.message)}}

function buildExperience(){const list=DATA.experience||[];$('panel-experience').innerHTML=`<h3>Experience</h3><div class="admin-actions"><button class="action new" onclick="editExperience('')">+ Add Experience</button></div><div class="list">${list.map(x=>`<div class="list-item"><div class="list-main"><strong>${esc(x.role)}</strong><small>${esc(x.organization)} · ${esc(x.period)}</small></div><div><button class="action secondary" onclick="editExperience('${x.id}')">Edit</button> <button class="action danger" onclick="deleteExperience('${x.id}')">Delete</button></div></div>`).join('')}</div>`}
function editExperience(id){const x=(DATA.experience||[]).find(a=>a.id===id)||{id:'',role:'',organization:'',period:'',description:'',sortOrder:(DATA.experience||[]).length+1};$('panel-experience').innerHTML=`<h3>${id?'Edit':'Add'} Experience</h3><div class="form-grid"><input id="e_id" type="hidden"><div class="field"><label>Role</label><input id="e_role"></div><div class="field"><label>Organization</label><input id="e_org"></div><div class="field"><label>Period</label><input id="e_period"></div><div class="field"><label>Display Order</label><input id="e_order" type="number"></div><div class="field full"><label>Description</label><textarea id="e_desc"></textarea></div></div><div class="admin-actions"><button class="action save" onclick="saveExperience()">Save</button><button class="action secondary" onclick="buildExperience()">Cancel</button></div>`;setv('e_id',x.id);setv('e_role',x.role);setv('e_org',x.organization);setv('e_period',x.period);setv('e_order',x.sortOrder);setv('e_desc',x.description)}
async function saveExperience(){try{DATA=await server.adminSaveExperience(TOKEN,{id:val('e_id'),role:val('e_role'),organization:val('e_org'),period:val('e_period'),description:val('e_desc'),sortOrder:Number(val('e_order'))||999});render(DATA);buildExperience();showStatus('Experience saved.')}catch(e){showStatus(e.message)}}
async function deleteExperience(id){if(!confirm('Delete this experience?'))return;try{DATA=await server.adminDeleteExperience(TOKEN,id);render(DATA);buildExperience();showStatus('Experience deleted.')}catch(e){showStatus(e.message)}}

function buildEducation(){const list=DATA.education||[];$('panel-education').innerHTML=`<h3>Education</h3><div class="admin-actions"><button class="action new" onclick="editEducation('')">+ Add Education</button></div><div class="list">${list.map(x=>`<div class="list-item"><div class="list-main"><strong>${esc(x.qualification)}</strong><small>${esc(x.institution)} · ${esc(x.period)}</small></div><div><button class="action secondary" onclick="editEducation('${x.id}')">Edit</button> <button class="action danger" onclick="deleteEducation('${x.id}')">Delete</button></div></div>`).join('')}</div>`}
function editEducation(id){const x=(DATA.education||[]).find(a=>a.id===id)||{id:'',qualification:'',institution:'',period:'',note:'',sortOrder:(DATA.education||[]).length+1};$('panel-education').innerHTML=`<h3>${id?'Edit':'Add'} Education</h3><div class="form-grid"><input id="d_id" type="hidden"><div class="field"><label>Qualification</label><input id="d_qual"></div><div class="field"><label>Institution</label><input id="d_inst"></div><div class="field"><label>Period</label><input id="d_period"></div><div class="field"><label>Display Order</label><input id="d_order" type="number"></div><div class="field full"><label>Notes</label><textarea id="d_note"></textarea></div></div><div class="admin-actions"><button class="action save" onclick="saveEducation()">Save</button><button class="action secondary" onclick="buildEducation()">Cancel</button></div>`;setv('d_id',x.id);setv('d_qual',x.qualification);setv('d_inst',x.institution);setv('d_period',x.period);setv('d_order',x.sortOrder);setv('d_note',x.note)}
async function saveEducation(){try{DATA=await server.adminSaveEducation(TOKEN,{id:val('d_id'),qualification:val('d_qual'),institution:val('d_inst'),period:val('d_period'),note:val('d_note'),sortOrder:Number(val('d_order'))||999});render(DATA);buildEducation();showStatus('Education saved.')}catch(e){showStatus(e.message)}}
async function deleteEducation(id){if(!confirm('Delete this education?'))return;try{DATA=await server.adminDeleteEducation(TOKEN,id);render(DATA);buildEducation();showStatus('Education deleted.')}catch(e){showStatus(e.message)}}

function buildSkills(){const list=DATA._skillRows||[];$('panel-skills').innerHTML=`<h3>Skills</h3><div class="admin-actions"><button class="action new" onclick="editSkill('')">+ Add Skill</button></div><div class="list">${list.map(x=>`<div class="list-item"><div class="list-main"><strong>${esc(x.name)}</strong><small>${esc(x.category)}</small></div><div><button class="action secondary" onclick="editSkill('${x.id}')">Edit</button> <button class="action danger" onclick="deleteSkill('${x.id}')">Delete</button></div></div>`).join('')}</div>`}
function editSkill(id){const x=(DATA._skillRows||[]).find(a=>a.id===id)||{id:'',category:'Data & Finance',name:'',sortOrder:(DATA._skillRows||[]).length+1};$('panel-skills').innerHTML=`<h3>${id?'Edit':'Add'} Skill</h3><div class="form-grid"><input id="s_id" type="hidden"><div class="field"><label>Category</label><select id="s_cat"><option>Data & Finance</option><option>Tools & Technology</option><option>Professional</option><option>Other</option></select></div><div class="field"><label>Skill</label><input id="s_name"></div><div class="field"><label>Display Order</label><input id="s_order" type="number"></div></div><div class="admin-actions"><button class="action save" onclick="saveSkill()">Save</button><button class="action secondary" onclick="buildSkills()">Cancel</button></div>`;setv('s_id',x.id);setv('s_cat',x.category);setv('s_name',x.name);setv('s_order',x.sortOrder)}
async function saveSkill(){try{DATA=await server.adminSaveSkill(TOKEN,{id:val('s_id'),category:val('s_cat'),name:val('s_name'),sortOrder:Number(val('s_order'))||999});render(DATA);buildSkills();showStatus('Skill saved.')}catch(e){showStatus(e.message)}}
async function deleteSkill(id){if(!confirm('Delete this skill?'))return;try{DATA=await server.adminDeleteSkill(TOKEN,id);render(DATA);buildSkills();showStatus('Skill deleted.')}catch(e){showStatus(e.message)}}

function buildProjects(){const list=DATA.projects||[];$('panel-projects').innerHTML=`<h3>Projects</h3><div class="admin-actions"><button class="action new" onclick="editProject('')">+ Add Project</button></div><div class="list">${list.map(x=>`<div class="list-item"><div class="list-main"><strong>${esc(x.title)}</strong><small>${esc(x.type)}</small></div><div><button class="action secondary" onclick="editProject('${x.id}')">Edit</button> <button class="action danger" onclick="deleteProject('${x.id}')">Delete</button></div></div>`).join('')}</div>`}
function editProject(id){const x=(DATA.projects||[]).find(a=>a.id===id)||{id:'',title:'',type:'',description:'',url:'',tags:[],sortOrder:(DATA.projects||[]).length+1};$('panel-projects').innerHTML=`<h3>${id?'Edit':'Add'} Project</h3><div class="form-grid"><input id="pr_id" type="hidden"><div class="field"><label>Title</label><input id="pr_title"></div><div class="field"><label>Type</label><input id="pr_type"></div><div class="field full"><label>Description</label><textarea id="pr_desc"></textarea></div><div class="field"><label>Project URL</label><input id="pr_url"></div><div class="field"><label>Tags (comma separated)</label><input id="pr_tags"></div><div class="field"><label>Display Order</label><input id="pr_order" type="number"></div></div><div class="admin-actions"><button class="action save" onclick="saveProject()">Save</button><button class="action secondary" onclick="buildProjects()">Cancel</button></div>`;setv('pr_id',x.id);setv('pr_title',x.title);setv('pr_type',x.type);setv('pr_desc',x.description);setv('pr_url',x.url);setv('pr_tags',(x.tags||[]).join(', '));setv('pr_order',x.sortOrder)}
async function saveProject(){try{DATA=await server.adminSaveProject(TOKEN,{id:val('pr_id'),title:val('pr_title'),type:val('pr_type'),description:val('pr_desc'),url:val('pr_url'),tags:val('pr_tags'),sortOrder:Number(val('pr_order'))||999});render(DATA);buildProjects();showStatus('Project saved.')}catch(e){showStatus(e.message)}}
async function deleteProject(id){if(!confirm('Delete this project?'))return;try{DATA=await server.adminDeleteProject(TOKEN,id);render(DATA);buildProjects();showStatus('Project deleted.')}catch(e){showStatus(e.message)}}

function buildGalleryAdmin(){const list=DATA.gallery||[];$('panel-galleryAdmin').innerHTML=`<h3>Gallery Manager</h3><div class="notice">Upload up to 10 photos per batch. Maximum 8 MB per image.</div><div class="form-grid"><div class="field"><label>Photo title</label><input id="g_title" placeholder="Professional conference"></div><div class="field"><label>Caption</label><input id="g_caption" placeholder="Optional description"></div><div class="field full"><label>Select photos</label><input id="g_files" type="file" accept="image/*" multiple></div></div><div class="admin-actions"><button class="action save" onclick="uploadGallery()">Upload Photos</button><span id="uploadProgress"></span></div><div class="list">${list.map(x=>`<div class="list-item"><div class="list-main"><strong>${esc(x.title)}</strong><small>${esc(x.caption)}</small></div><div><button class="action secondary" onclick="editGallery('${x.id}')">Edit</button> <button class="action danger" onclick="deleteGallery('${x.id}')">Delete</button></div></div>`).join('')}</div>`}
function editGallery(id){const x=(DATA.gallery||[]).find(a=>a.id===id);if(!x)return;$('panel-galleryAdmin').innerHTML=`<h3>Edit Gallery Photo</h3><div class="form-grid"><div class="field"><label>Title</label><input id="ge_title"></div><div class="field"><label>Caption</label><input id="ge_caption"></div></div><div class="admin-actions"><button class="action save" onclick="saveGalleryEdit('${id}')">Save</button><button class="action secondary" onclick="buildGalleryAdmin()">Cancel</button></div>`;setv('ge_title',x.title);setv('ge_caption',x.caption)}
async function saveGalleryEdit(id){try{DATA=await server.adminUpdateGallery(TOKEN,{id,title:val('ge_title'),caption:val('ge_caption')});render(DATA);buildGalleryAdmin();showStatus('Gallery item updated.')}catch(e){showStatus(e.message)}}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}
async function uploadGallery(){const files=[...($('g_files')?.files||[])];if(!files.length){showStatus('Choose at least one photo.');return}if(files.length>10){showStatus('Select no more than 10 photos.');return}try{for(let i=0;i<files.length;i++){const f=files[i];if(f.size>8*1024*1024){showStatus(f.name+' is larger than 8 MB.');return}$('uploadProgress').textContent=`Uploading ${i+1} of ${files.length}: ${f.name}`;const base64=await fileToBase64(f);DATA=await server.adminUploadGalleryImage(TOKEN,{name:f.name,mimeType:f.type,base64,title:val('g_title')||f.name,caption:val('g_caption')})}render(DATA);buildGalleryAdmin();showStatus('Gallery updated.')}catch(e){showStatus(e.message||'Gallery upload failed.')}}
async function deleteGallery(id){if(!confirm('Delete this photo and move its Drive file to trash?'))return;try{DATA=await server.adminDeleteGalleryImage(TOKEN,id);render(DATA);buildGalleryAdmin();showStatus('Photo deleted.')}catch(e){showStatus(e.message)}}

function buildContactAdmin(){const rows=DATA._contactRows||[];$('panel-contactAdmin').innerHTML=`<h3>Contact Details</h3><div class="notice">Add any contact channel. Email and phone work automatically; LinkedIn, GitHub, WhatsApp or any other channel can use a full URL.</div><div class="admin-actions"><button class="action new" onclick="addContactRow()">+ Add Contact Item</button></div><div class="list" id="contactAdminList"></div><div class="admin-actions"><button class="action save" onclick="saveContact()">Save Contact Details</button></div>`;rows.forEach(x=>addContactRow(x.label,x.value,x.url,x.id))}
function addContactRow(label='',value='',url='',id=''){const wrap=document.createElement('div');wrap.className='list-item contact-edit';wrap.innerHTML=`<div class="form-grid" style="flex:1"><input class="c_id" type="hidden" value="${esc(id)}"><div class="field"><label>Label</label><input class="c_label" value="${esc(label)}"></div><div class="field"><label>Value</label><input class="c_value" value="${esc(value)}"></div><div class="field full"><label>URL (optional)</label><input class="c_url" value="${esc(url)}"></div></div><button class="action danger" onclick="this.closest('.contact-edit').remove()">Remove</button>`;$('contactAdminList').appendChild(wrap)}
async function saveContact(){const items=[...document.querySelectorAll('#contactAdminList .contact-edit')].map((r,i)=>({id:r.querySelector('.c_id').value,label:r.querySelector('.c_label').value,value:r.querySelector('.c_value').value,url:r.querySelector('.c_url').value,sortOrder:i+1}));try{DATA=await server.adminSaveContact(TOKEN,items);render(DATA);buildContactAdmin();showStatus('Contact details saved.')}catch(e){showStatus(e.message)}}

function buildSettings(){const s=DATA.settings||{};$('panel-settings').innerHTML=`<h3>Website Files</h3><div class="notice">Upload a profile photo or PDF resume directly to Google Drive. The public site will use the newest saved file.</div><div class="form-grid"><div class="field full"><label>New Profile Photo</label><input id="set_photo_file" type="file" accept="image/*"></div><div class="field full"><label>New Resume / CV (PDF)</label><input id="set_resume_file" type="file" accept="application/pdf,.pdf"></div><div class="field full"><label>Existing Profile Photo File ID</label><input id="set_photo_id"></div><div class="field full"><label>Existing Resume File ID</label><input id="set_resume_id"></div></div><div class="admin-actions"><button class="action save" onclick="uploadProfilePhoto()">Upload Profile Photo</button><button class="action save" onclick="uploadResume()">Upload CV</button><button class="action secondary" onclick="saveSettings()">Save File IDs</button></div>`;setv('set_photo_id',s.profilePhotoFileId);setv('set_resume_id',s.resumeFileId)}
async function uploadProfilePhoto(){const f=$('set_photo_file')?.files?.[0];if(!f){showStatus('Choose a profile photo first.');return}if(f.size>8*1024*1024){showStatus('Profile photo must be 8 MB or smaller.');return}try{const base64=await fileToBase64(f);DATA=await server.adminUploadProfilePhoto(TOKEN,{name:f.name,mimeType:f.type,base64});render(DATA);buildSettings();showStatus('Profile photo updated.')}catch(e){showStatus(e.message)}}
async function uploadResume(){const f=$('set_resume_file')?.files?.[0];if(!f){showStatus('Choose a PDF CV first.');return}if(f.size>12*1024*1024){showStatus('CV must be 12 MB or smaller.');return}try{const base64=await fileToBase64(f);DATA=await server.adminUploadResume(TOKEN,{name:f.name,mimeType:'application/pdf',base64});render(DATA);buildSettings();showStatus('CV updated.')}catch(e){showStatus(e.message)}}
async function saveSettings(){try{DATA=await server.adminSaveSettings(TOKEN,{photoFileId:val('set_photo_id'),resumeFileId:val('set_resume_id')});render(DATA);buildSettings();showStatus('Website file settings saved.')}catch(e){showStatus(e.message)}}


function uploadProfilePhotoFromProfile(){const f=$('profile_photo_file')?.files?.[0];if(!f)return;uploadProfilePhotoFile(f)}
async function uploadProfilePhotoFile(f){if(f.size>8*1024*1024){showStatus('Profile photo must be 8 MB or smaller.');return}try{showStatus('Uploading profile photo...');const base64=await fileToBase64(f);DATA=await server.adminUploadProfilePhoto(TOKEN,{name:f.name,mimeType:f.type,base64});render(DATA);buildAdmin();showStatus('Profile photo updated.')}catch(e){showStatus(e.message||'Profile photo upload failed.')}}
function closeAdmin(){window.location.href='/'}
function startAdmin(){if(TOKEN){refreshAdmin()}else{$('loginView').style.display='block';$('dashboardView').style.display='none';$('loginEmail').focus()}}
$('loginPin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('loginEmail').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
window.addEventListener('load',startAdmin);
</script>
</body>
</html>
